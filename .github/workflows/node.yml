name: Build and Push Assets to Tag

on:
  push:
    tags:
      - 'v*.*.*' # Triggers on any semantic version tag push (e.g., v1.0.0, v2.1.3)

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  release-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update the Git tag assets
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build JS
        run: npx tsc

      - name: Build CSS
        run: npm run build-css

      - name: Publish to NPM
        run: npm publish --access public
